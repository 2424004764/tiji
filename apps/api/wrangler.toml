name = "tiji-api"
main = "src.ts"
compatibility_date = "2026-09-14"

[dev]
port = 8799

[vars]
# 允许跨域访问 API 的前端地址（CORS 白名单），多个用英文逗号分隔
# 前端部署到 Pages 后，把实际域名填进来（如 "https://tiji.pages.dev"），再执行 wrangler deploy 生效
PUBLIC_APP_URL = "https://tiji.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "tiji-db"
database_id = "cb21f817-5469-44bd-a62f-1df57f515db0"
migrations_dir = "../../infra/d1"
